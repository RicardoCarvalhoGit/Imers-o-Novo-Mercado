<script>
// Lead: esta página só é aberta pelo redirecionamento do Tally depois que o
// cadastro é enviado com sucesso. Dispara uma única vez por aba (recarregar
// a página não conta um segundo Lead).
(function () {
  var jaDisparou = false;
  try { jaDisparou = sessionStorage.getItem('inm_lead') === '1'; } catch (e) {}
  if (jaDisparou) return;
  fbq('track', 'Lead');
  try { sessionStorage.setItem('inm_lead', '1'); } catch (e) {}
})();
</script>

<style>
  .obrigado {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 20px;
    text-align: center;
    background:
      radial-gradient(ellipse at top, rgba(212,169,74,.14), transparent 60%),
      var(--color-bg-dark);
  }
  .obrigado .logo { margin-bottom: 40px; align-items: center; }
  .obrigado-card {
    width: 100%;
    max-width: 620px;
    padding: 40px 28px;
    border: 1px solid rgba(212,169,74,.35);
    border-radius: var(--radius);
    background: var(--color-bg-darker);
  }
  .obrigado-check {
    width: 56px; height: 56px;
    margin: 0 auto 20px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--color-gold-light), var(--color-gold));
    color: #201703;
  }
  .obrigado h1 { font-size: clamp(1.5rem, 4vw, 2.1rem); }
  .obrigado-texto { color: var(--color-text-muted); font-size: 1.05rem; margin-bottom: 28px; }
  .obrigado .btn-whats {
    width: 100%;
    padding: 20px 24px;
    font-size: 1.05rem;
    line-height: 1.3;
  }
</style>
</head>
<body>

<main class="obrigado">
  <a href="/" class="logo">
    <span class="logo-top">Imersão</span>
    <span class="logo-bottom">Novo Mercado</span>
  </a>

  <div class="obrigado-card">
    <div class="obrigado-check" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
    </div>
    <h1 id="saudacao">Cadastro <span class="highlight">confirmado!</span></h1>
    <p class="obrigado-texto">Seu cadastro na Imersão Novo Mercado foi recebido.</p>
    <a class="btn btn-primary btn-whats" href="https://wa.me/5511982273141?text=Oi%2C%20Moys%C3%A9s%21%20Fiz%20o%20cadastro%20da%20Imers%C3%A3o%20e%20quero%20o%20meu%20diagn%C3%B3stico." target="_blank" rel="noopener">Receber meu Diagnóstico comentado no WhatsApp</a>
  </div>
</main>

<script>
// Se o Tally mandar o nome na URL (?nome=Maria), usa o primeiro nome na saudação.
(function () {
  var params = new URLSearchParams(window.location.search);
  var nome = (params.get('nome') || params.get('name') || '').trim().split(/\s+/)[0];
  if (!nome || nome.charAt(0) === '@' || nome.length > 40) return;
  nome = nome.charAt(0).toUpperCase() + nome.slice(1).toLowerCase();
  var h1 = document.getElementById('saudacao');
  h1.textContent = nome + ', seu cadastro está ';
  var destaque = document.createElement('span');
  destaque.className = 'highlight';
  destaque.textContent = 'confirmado!';
  h1.appendChild(destaque);
})();
</script>
</body>
